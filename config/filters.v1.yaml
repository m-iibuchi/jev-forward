# 除外・重要度低下・TOB 例外・連番の表題パターン v1（要件 F1-4、ADR 003・016・019、検証ログ #19〜#21）。
# 正規表現は Python re、表題には re.search、連番は表題末尾に一致。このファイルは変更しない（変更は v2 を新規作成）。
version: v1

# TDnet 一覧の社名接頭辞。一致した銘柄は判定しない（bundle_role='excluded', skip_reason='excluded_instrument'）
exclude_name_prefixes: ["Ｅ－", "Ｎ－", "Ｒ－", "Ｉ－"]       # ETF / ETN / REIT / インフラファンド

# 市場区分の接頭辞。社名を state に入れる前に剥がす。除外はしない
market_name_prefixes: ["Ｐ－", "Ｓ－", "Ｇ－"]                # プライム / スタンダード / グロース

# 接頭辞から市場区分へ。段階1は listed_master が無いので issuer.market をここから埋める（05-state構築 4.2）
market_map:
  "Ｐ－": 東証プライム
  "Ｓ－": 東証スタンダード
  "Ｇ－": 東証グロース

# 5文字コードへの正規表現。一致で excluded_instrument。5文字目 4 は ETF（tests/fixtures/tdnet_list_2026-09-14_16.tsv の 13264 等）
# 整理・監理銘柄と上場後60日未満はコードでは分からないので listed_master（M6）で判定する（task 014）
exclude_code_patterns:
  - "^[0-9]{4}4$"

# 表題で除外（判定しない）。skip_reason='excluded_title'
exclude_titles:
  - "投資信託約款の変更"
  - "収益分配金"
  - "日々の開示事項"

# 表題で重要度低下（判定するが flags_json に low_priority:<key> を付け、ダイジェストから外す）
# key は上から growth_plan / cg_report
low_priority_titles:
  - "事業計画及び成長可能性に関する事項"
  - "コーポレート・?ガバナンス(に関する)?報告書"

# TOB の候補（ADR 003）
tob_titles: ["公開買付", "ＭＢＯ", "MBO", "株式交換"]

# 対象者側。束ね例外（tob_primary ＋ tob_attached）を適用するのはこれだけ（ADR 023）
tob_target_titles: ["当社株券等に対する公開買付", "当社株式に対する公開買付", "賛同の意見表明", "賛同の表明", "応募推奨"]

# tob_titles に一致しても TOB として扱わない表題（ミンカブ「公開買付けに準ずる行為…」、カカクコム「…の一部変更」。ADR 023）
tob_exclude_titles: ["準ずる行為", "一部変更に関するお知らせ$"]

# 主開示の優先順。上から patterns を見て最初に一致した entry の rank を使い、
# どれにも一致しなければ default_rank（列挙に無い開示は訂正・事務より上、決算短信より下）。04-束ね 4.4
primary_priority:
  - {key: forecast_revision, rank: 1, patterns: ["業績予想.{0,10}修正", "配当予想.{0,10}修正", "業績予想と実績との差異"]}
  - {key: misconduct,        rank: 2, patterns: ["不適切", "調査報告書", "意見不表明", "重要な不備", "課徴金", "特別調査委員会", "訴訟の提起", "改善計画"]}
  - {key: capital,           rank: 3, patterns: ["資本業務提携", "株式譲渡", "新株予約権", "自己株式", "第三者割当", "吸収合併", "事業譲渡", "特別損失", "特別利益"]}
  - {key: earnings,          rank: 4, patterns: ["決算短信"]}
  - {key: correction,        rank: 6, patterns: ["^[（(]訂正", "訂正報告書", "定款の一部変更", "基準日設定", "代表取締役の異動"]}
default_rank: 5

# 連番表題。表題末尾のこの部分を除いた文字列が一致する開示を1つの論理開示にする
sequence_patterns:
  - "[（(]\\s*[0-9０-９]+\\s*[／/]\\s*[0-9０-９]+\\s*[）)]\\s*$"    # （１／３）(1/3)
  - "【\\s*[0-9０-９]+\\s*】\\s*$"                                     # 【1】
  - "[（(]その\\s*[0-9０-９]+\\s*[）)]\\s*$"                            # （その１）
